<dialog #dialogRef class="modal">
    <div class="modal-box text-center">
        <div class="flex flex-col justify-center w-full items-center my-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                class="size-40 stroke-indigo-500">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
            </svg>
            
        </div>
        <h3 class="font-bold text-lg">{{message}}</h3>
        <p class="py-2">This action cannot be undone.</p>
        <div class="modal-action flex justify-center items-center w-full">
            <button class="btn btn-outline btn-error w-1/4" (click)="cancel()">Cancel</button>
            <button class="btn btn-outline btn-success w-1/2" (click)="confirm()">Confirm</button>
        </div>
    </div>
</dialog>
